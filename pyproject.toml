[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leisurelog"
version = "0.4.0b1"
description = "Local-first modular computer activity tracking and project analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
desktop = ["pystray==0.19.5", "Pillow>=11,<13"]
packaging = ["pyinstaller>=6.20,<7"]

[project.scripts]
leisurelog-desktop = "leisurelog.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leisurelog = ["api/static/*", "api/static/fonts/*", "api/static/skins/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
