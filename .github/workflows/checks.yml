name: Architecture and regression checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check dependency boundaries before installing the application
        run: python scripts/check_architecture.py
      - name: Install pinned test and desktop dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation -c requirements-lock.txt -c packaging/requirements-build.txt ".[desktop,dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test with isolated data
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force outputs | Out-Null
          python -m pytest -q --basetemp outputs/ci-temp --junitxml outputs/ci-tests.xml
  browser-behavior:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test interface behavior
        run: node --test tests/js/*.test.cjs
